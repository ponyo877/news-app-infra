# bare構成用(旧 nginx/default.conf の移植。app:8000 → 127.0.0.1:8000)
server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    charset utf-8;

    # フロントバグ対応で封鎖中(Phase 2 で類似記事機能を復活させる際に外す)
    location /v1/article/similar/ {
        deny all;
    }

    location /v1/ {
        proxy_pass   http://127.0.0.1:8000;
    }

    # 死活監視用(外形監視から叩ける)
    location = /health {
        proxy_pass   http://127.0.0.1:8000;
    }

    # 共有着地ページ(OGP付きHTML。appがSSRする。Cache-Controlはapp側で自己管理)
    location /a/ {
        proxy_pass   http://127.0.0.1:8000;
    }

    # app-ads.txt(IAB Tech Lab / Authorized Sellers for Apps)。
    # AdMobのクローラーがこれを取得して正規の販売者かを判定する。
    # 実体はappがgo:embedで持つ(landing_article.htmlと同じ流儀)ので、
    # ファイルを置かずにそのままプロキシする
    location = /app-ads.txt {
        proxy_pass   http://127.0.0.1:8000;
    }

    # Universal Links / App Links 検証ファイル。
    # AASAは拡張子なしのためdefault_type明示が必須(ないとtext/plainになりApple側で無効)。
    # max-age短め=設置ミス時に5分で直せる。Cloudflare側のCache Ruleは作らない(更新遅延事故防止)
    location = /.well-known/apple-app-site-association {
        root /var/www;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }
    location = /.well-known/assetlinks.json {
        root /var/www;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # 画像・scraper-rules.json の配信と、アプリからのWebDAVアップロード受け
    location /static/ {
        root /var/www;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_access user:rw group:rw all:rw;
        create_full_put_path on;
        autoindex on;
        charset utf-8;
    }
}
