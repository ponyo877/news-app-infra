version: "3.7"

services:
  app:
    # v0.0.25: app-ads.txt配信・着地ページの広告訴求文言を撤去(AdMob是正)。
    # v0.0.24: Cache-Control修正(端末キャッシュ抑止)・ML無効化オプション・Go 1.26。v0.0.23: 検索LIMIT・終端500修正・Cache-Control・/v1/user閉鎖・CronGuard・WebDAV PUT検証(d517eff)
    # v0.0.22: /v1/static配信修正(Download実装)。v0.0.21: /health・クローラ堅牢化・画像ドメイン修正
    image: gcr.io/gke-test-287910/news-app:v0.0.25
    ports:
      # 外部公開はnginx(:80)のみ。直結ポートはホスト内に限定する
      - 127.0.0.1:8000:8000
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      # POST /v1/staticが返す公開URLの起点。matome-kun.gaは失効済みのため変更禁止
      AP_ROOT: https://matome.folks-chat.com
      AP_PORT: 8000
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: mysql
      DB_DATABASE: matome
      DB_PORT: 3306
      KVS_PASSWORD: password
      KVS_HOST: redis
      KVS_DATABASE: 0
      KVS_PORT: 6379
      WD_HOST: nginx
      WD_PORT: 80
      MLM_DIR: /srv/models
      MLM_NAME: ""  # BERT無効(地雷指定・類似記事はnginxで封鎖済のため実害なし。戻す場合はizumi-lab/bert-small-japanese)
      MLM_INDEX_PATH: /srv/matome.ann
      # /v1/stock 系の保護トークン。値はVMの .env(git管理外)に置く。
      # systemdタイマー(stock.service)のcurlにも同じ値のヘッダーが必要
      CRON_TOKEN: ${CRON_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/data:/srv
  mysql:
    image: mysql:5.7
    ports:
      - 127.0.0.1:3306:3306
    restart: always
    platform: linux/amd64
    mem_limit: 512m
    mem_reservation: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: matome
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  # mysql8:
  #   image: mysql:8.3
  #   ports:
  #     - 4306:3306
  #   restart: always
  #   platform: linux/amd64
  #   volumes:
  #     - ./mysql/data8:/var/lib/mysql
  #     - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
  #     - ./mysql/sql:/docker-entrypoint-initdb.d
  #   environment:
  #     MYSQL_ROOT_PASSWORD: password
  #     MYSQL_DATABASE: matome
  #   healthcheck:
  #     test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-ppassword"]
  #     interval: 1m30s
  #     timeout: 30s
  #     retries: 5
  #     start_period: 30s
  redis:
    image: redis:latest
    command: redis-server --requirepass password
    ports:
      - 127.0.0.1:6379:6379
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "password", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  # RSSクロール(GET /v1/stock)はVMのsystemdタイマー(stock.timer, 2分ごと)が実行している。
  # 定義: /etc/systemd/system/stock.{timer,service}(リポジトリ管理外)
  nginx:
    image: gcr.io/gke-test-287910/news-nginx:v0.0.1
    ports:
      - 80:80
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/privacy_policy.html:/var/www/static/privacy_policy/index.html
      - ./nginx/eula.html:/var/www/static/eula/index.html
      - ./nginx/data:/var/www/static/
    depends_on:
      app:
        condition: service_started